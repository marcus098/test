<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestione Prodotti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #6a0dad;
            margin: 0;
            padding: 30px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background-color: #7e2ebf;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .product-list {
            margin-bottom: 30px;
        }
        .product-item {
            background-color: #9f4dff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .button {
            background-color: #ff6b6b;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .button:hover {
            background-color: #e04e4e;
        }
        .popup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
        }
        input, textarea {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Gestione Prodotti del Tuo Shop</h1>

    <div class="product-list">
        <div th:each="product : ${articles}" class="product-item">
            <div>
                <strong th:text="${product.name}">Nome</strong><br/>
                <small th:text="${product.category}">Categoria</small><br/>
                <small th:text="'Prezzo: €' + ${product.price}">Prezzo</small>
            </div>
            <form th:action="@{/products/shop/{id}(id=${product.id})}" method="post" onsubmit="return confirm('Confermi eliminazione?')">
                <input type="hidden" name="_method" value="delete" />
                <button class="button" type="submit">Elimina</button>
            </form>
        </div>
    </div>



    <button class="button" onclick="openPopup()">Aggiungi Prodotto</button>
</div>

<!-- Popup -->
<div class="popup" id="productPopup">
    <div class="popup-content">
        <h2>Nuovo Prodotto</h2>
        <form th:action="@{/products/shop}" th:object="${article}" method="post">
            <input type="text" th:field="*{name}" placeholder="Nome prodotto" required />
            <textarea th:field="*{category}" placeholder="Categoria" required></textarea>
            <input type="number" th:field="*{price}" placeholder="Prezzo" required />
            <button type="submit" class="button">Salva</button>
            <button type="button" class="button" onclick="closePopup()">Chiudi</button>
        </form>

    </div>
</div>

<script>

    function openPopup() {
        document.getElementById('productPopup').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('productPopup').style.display = 'none';
    }

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    header {
      font-weight: 600;
      font-size: 3rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }
    p {
      font-weight: 400;
      font-size: 1.25rem;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
    }
    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 40px;
      background-color: #ff6b6b;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #ff4b4b;
    }
  </style>
</head>
<body>
  <header>Benvenuto, Admin!</header>
  <p>Questa è la tua home page amministrativa, dove puoi gestire utenti, prodotti e configurazioni di sistema.</p>
  <button onclick="window.location.href='/dashboardpage'">Vai al pannello di controllo</button>
</body>
</html>

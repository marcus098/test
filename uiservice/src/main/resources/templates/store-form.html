<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Store Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin: 0;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .success-message {
            background-color: #28a745;
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        form {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.3rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            margin-top: 1rem;
            background-color: #ff6b6b;
            color: white;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ff4b4b;
        }
    </style>
</head>
<body>

    <h1>Crea il tuo store</h1>

    <!-- Messaggio di successo -->
    <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>

    <form th:action="@{/addStore}" method="post" th:object="${store}">
        <label>
            Nome:
            <input type="text" th:field="*{name}" placeholder="Nome store" />
        </label>
        <label>
            Indirizzo:
            <input type="text" th:field="*{address}" placeholder="Indirizzo store" />
        </label>
        <button type="submit">Aggiungi Store</button>
    </form>

</body>
</html>

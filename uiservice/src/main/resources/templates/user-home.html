<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
    }
    header {
      font-weight: 600;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #4a4a4a;
      letter-spacing: 1px;
    }
    p {
      font-weight: 400;
      font-size: 1.15rem;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      color: #666;
    }
    button {
      margin-top: 2rem;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #667eea;
      border-radius: 40px;
      background-color: transparent;
      color: #667eea;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    button:hover {
      background-color: #667eea;
      color: white;
    }
  </style>
</head>
<body>
  <header>Benvenuto, Utente!</header>
  <p>Questa è la tua home page personale. Qui puoi esplorare i prodotti, vedere le tue attività e personalizzare la tua esperienza.</p>
  <button onclick="window.location.href='/dashboardpage'">Vai al tuo profilo</button>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Admin - ' + ${store.name}">Admin Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #6a0dad; /* violetto */
            margin: 0;
            padding: 30px;
            color: #f0e6ff; /* testo chiaro per contrasto */
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #7e2ebf; /* viola più chiaro per il contenuto */
            border-radius: 8px;
            padding: 30px 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            text-align: center;
        }
        h1 {
            font-weight: 600;
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #e0ccff;
        }
        p.address {
            font-size: 1rem;
            color: #d6b8ff;
            margin: 18px 0 36px;
        }
        a.button {
            display: inline-block;
            text-decoration: none;
            background-color: #9f4dff;
            color: white;
            padding: 12px 28px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        a.button:hover {
            background-color: #7a36cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="'Sezione admin di: ' + ${store.name}">Benvenuto nella sezione admin di Nome Store</h1>
        <p class="address" th:text="${store.address}">Indirizzo Store</p>
        <a th:href="@{'/store/' + ${store.id} + '/addProduct'}" class="button">Carica Prodotti</a>
    </div>
</body>
</html>

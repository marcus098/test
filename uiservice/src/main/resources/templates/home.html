<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-weight: 600;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.3rem;
            max-width: 600px;
            margin-bottom: 2rem;
            color: #ddd;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        a {
            background-color: #ff6b6b;
            color: white;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #ff4b4b;
        }
    </style>
</head>
<body>

    <h1>Benvenuto su GeoShop</h1>

    <p>La piattaforma dove gestisci i tuoi prodotti e ordini in modo semplice ed elegante.</p>

    <div class="buttons">
        <a th:href="@{/login}">Accedi</a>
        <a th:href="@{/register}">Registrati</a>
    </div>

</body>
</html>

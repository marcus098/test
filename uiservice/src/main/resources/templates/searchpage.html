<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ricerca Prodotti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a82fb, #fc5c7d);
            padding: 50px;
            color: white;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        button {
            background-color: white;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        .product {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .no-results {
            font-style: italic;
            color: #eee;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Cerca un prodotto</h1>

    <form th:action="@{/products/search}" method="get">
        <input type="text" name="name" placeholder="Scrivi il nome del prodotto..." th:value="${param.name}" required />
        <button type="submit">Cerca</button>
    </form>

    <div th:if="${articles != null}">
        <div th:if="${#lists.isEmpty(articles)}" class="no-results">
            Nessun prodotto trovato.
        </div>
        <div th:each="p : ${articles}" class="product">
            <strong th:text="${p.name}">Nome</strong><br/>
            <small th:text="${p.category}">Categoria</small><br/>
            <small th:text="'Prezzo: €' + ${p.price}">Prezzo</small><br/>
            <small th:if="${p.distance != null}" th:text="'Distanza: ' + ${#numbers.formatDecimal(p.distance, 1, 2)} + ' km'">Distanza</small>
        </div>
    </div>
</div>
</body>
</html>
